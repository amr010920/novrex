<script>
(function () {
    const SUPABASE_URL = "https://vzkupnfktlyjmhjgzfli.supabase.co";
    const SUPABASE_KEY = "sb_publishable_I0BgbGkSpxoerOsrnVNvhw_w_s7YP6u";
    const DISCORD_CLIENT_ID = "1574061142081540217";
    const REDIRECT_URL = window.location.origin + window.location.pathname;
    const COOKIE_NAME = "nvx_session";

    const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    const loginForm = document.getElementById("nvx-login-form");
    const usernameInput = document.getElementById("login-username");
    const passwordInput = document.getElementById("login-password");
    const loginErrorEl = document.getElementById("nvx-login-error");
    const loginStatusEl = document.getElementById("nvx-login-status");
    const discordBtn = document.getElementById("facebook-login-button");
    const cookieBox = document.getElementById("nvx-active-cookie-box");
    const cookieText = document.getElementById("nvx-active-cookie-text");
    const logoutBtn = document.getElementById("nvx-logout-btn");

    function setNovrexCookie(accountData, days = 30) {
        const expires = new Date(Date.now() + days * 86400000).toUTCString();
        const encoded = encodeURIComponent(JSON.stringify(accountData));
        const secure = window.location.protocol === "https:" ? "; Secure" : "";
        document.cookie = `${COOKIE_NAME}=${encoded}; expires=${expires}; path=/; SameSite=Lax${secure}`;
    }

    function getNovrexCookie() {
        const parts = document.cookie ? document.cookie.split("; ") : [];
        for (const part of parts) {
            const eq = part.indexOf("=");
            if (eq === -1) continue;
            if (part.slice(0, eq) === COOKIE_NAME) {
                try {
                    return JSON.parse(decodeURIComponent(part.slice(eq + 1)));
                } catch (_e) {
                    return null;
                }
            }
        }
        return null;
    }

    function clearNovrexCookie() {
        const secure = window.location.protocol === "https:" ? "; Secure" : "";
        document.cookie = `${COOKIE_NAME}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; SameSite=Lax${secure}`;
    }

    function renderCookieUI() {
        const acct = getNovrexCookie();
        if (acct && acct.username) {
            cookieText.textContent = `Saved session cookie: ${acct.username} (#${acct.id})`;
            cookieBox.style.display = "flex";
        } else {
            cookieBox.style.display = "none";
        }
    }

    async function sha256Hex(str) {
        const buf = new TextEncoder().encode(str);
        const hash = await crypto.subtle.digest("SHA-256", buf);
        return Array.from(new Uint8Array(hash)).map((b) => b.toString(16).padStart(2, "0")).join("");
    }

    loginForm.addEventListener("submit", async function (e) {
        e.preventDefault();
        loginErrorEl.textContent = "";
        loginStatusEl.textContent = "";

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!username || !password) {
            loginErrorEl.textContent = "Please enter both username and password.";
            return;
        }
        if (!sb) {
            loginErrorEl.textContent = "Supabase client failed to load.";
            return;
        }

        const passwordHash = await sha256Hex(password);
        const { data, error } = await sb
            .from("novrex_users")
            .select("id, username, discord_username, password_hash")
            .eq("username", username)
            .maybeSingle();

        if (error || !data || data.password_hash !== passwordHash) {
            loginErrorEl.textContent = "Invalid username or password.";
            return;
        }

        setNovrexCookie({
            id: data.id,
            username: data.username,
            discord_username: data.discord_username || ""
        });
        renderCookieUI();
        loginStatusEl.style.color = "#2ecc71";
        loginStatusEl.textContent = `Logged in as ${data.username} (#${data.id}). Cookie saved.`;
    });

    discordBtn.addEventListener("click", function () {
        loginErrorEl.textContent = "";
        loginStatusEl.textContent = "";
        if (!DISCORD_CLIENT_ID || DISCORD_CLIENT_ID === "PASTE_YOUR_DISCORD_CLIENT_ID_HERE") {
            loginErrorEl.textContent = "Paste your DISCORD_CLIENT_ID first.";
            return;
        }
        const authUrl = "https://discord.com/oauth2/authorize?client_id=" +
            encodeURIComponent(DISCORD_CLIENT_ID) +
            "&response_type=token&redirect_uri=" + encodeURIComponent(REDIRECT_URL) +
            "&scope=identify";
        window.location.href = authUrl;
    });

    logoutBtn.addEventListener("click", function () {
        clearNovrexCookie();
        renderCookieUI();
        loginStatusEl.style.color = "#95a5a6";
        loginStatusEl.textContent = "Session cookie cleared.";
    });

    async function handleDiscordCallback() {
        const hash = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : "";
        if (!hash) return;
        const params = new URLSearchParams(hash);
        const token = params.get("access_token");
        if (!token) return;

        history.replaceState(null, "", window.location.pathname + window.location.search);

        try {
            const res = await fetch("https://discord.com/api/users/@me", {
                headers: { Authorization: "Bearer " + token }
            });
            if (!res.ok) throw new Error("Failed to fetch Discord user");
            const profile = await res.json();

            if (!sb) return;
            const { data, error } = await sb
                .from("novrex_users")
                .select("id, username, discord_username")
                .eq("discord_id", String(profile.id))
                .maybeSingle();

            if (error || !data) {
                loginErrorEl.textContent = "No Novrex account is linked to this Discord user yet. Sign up first.";
                return;
            }

            setNovrexCookie({
                id: data.id,
                username: data.username,
                discord_username: data.discord_username || profile.username || ""
            });
            renderCookieUI();
            loginStatusEl.style.color = "#2ecc71";
            loginStatusEl.textContent = `Logged in via Discord as ${data.username} (#${data.id}). Cookie saved.`;
        } catch (err) {
            loginErrorEl.textContent = "Discord login error: " + err.message;
        }
    }

    renderCookieUI();
    handleDiscordCallback();
})();
</script>
