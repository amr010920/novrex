<!DOCTYPE html>
<html>
<head>
  <title>Avatar - Roblox</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,requiresActiveX=true" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="user-data" data-userid="1" data-name="NovrexUser" data-displayname="NovrexUser" />
  <link rel="stylesheet" data-bundlename="StyleGuide" href="https://css.rbxcdn.com/09505554a40f76a420edee7341587691b49c6cfede7ba183b5fc3177a922cd95.css" />
  <link rel="stylesheet" data-bundlename="Navigation" href="https://css.rbxcdn.com/49c237ffce3f7e242a26d9e334d30d5f539e4737b6c59576ee2f28ab4697d61a.css" />
  <link rel="stylesheet" data-bundlename="Footer" href="https://css.rbxcdn.com/55b250e8473888792f885d898973a13692fb22157baf61aaffa62ce4545f3408.css" />
  <link rel="stylesheet" href="https://static.rbxcdn.com/css/leanbase___3678d89e5ec3f4d8c65d863691f31de2_m.css/fetch" />
  <link rel="stylesheet" href="https://static.rbxcdn.com/css/page___35336144d22fbc9d8458410c928c5780_m.css/fetch" />
  <link rel="stylesheet" data-bundlename="Avatar" href="https://css.rbxcdn.com/43246eb063d4fce7f3f28a2c6d167e33c7ecc50cf90dec5888d84a4923e7f243.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .nvx-avatar-page {
      padding: 16px 0 36px 0;
    }
    .nvx-topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .nvx-topbar h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      color: #191919;
    }
    .nvx-controls-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .nvx-controls-bar label {
      font-size: 13px;
      font-weight: 700;
      color: #393b3d;
    }
    .nvx-controls-bar input,
    .nvx-controls-bar select {
      height: 32px;
      padding: 4px 10px;
      border: 1px solid #b8babc;
      border-radius: 3px;
      background: #ffffff;
      color: #191919;
      font-size: 13px;
    }
    .nvx-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 18px;
      align-items: start;
    }
    @media (max-width: 860px) {
      .nvx-layout {
        grid-template-columns: 1fr;
      }
    }
    .nvx-card {
      background: #ffffff;
      border: 1px solid #d0d3d6;
      border-radius: 3px;
      padding: 16px;
    }
    #avatar-full-player {
      position: relative;
      width: 100%;
      height: 360px;
      border-radius: 3px;
      background: linear-gradient(180deg, #e7edf2 0%, #d4dde5 100%);
      border: 1px solid #c5ccd2;
      overflow: hidden;
      cursor: grab;
    }
    #avatar-full-player:active {
      cursor: grabbing;
    }
    #avatar-full-player canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .nvx-stage-hint {
      margin-top: 8px;
      font-size: 11px;
      color: #65686b;
      text-align: center;
    }
    .nvx-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .nvx-btn {
      height: 34px;
      padding: 0 14px;
      border-radius: 3px;
      border: 1px solid #0074bd;
      background: #0084d6;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .nvx-btn:hover {
      background: #006fb3;
    }
    .nvx-btn-light {
      background: #ffffff;
      color: #191919;
      border-color: #b8babc;
    }
    .nvx-btn-light:hover {
      background: #f2f4f5;
    }
    #avatar-save-status {
      margin-top: 10px;
      font-size: 12px;
      font-weight: 700;
      color: #393b3d;
      min-height: 18px;
    }
    .nvx-renders-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #e1e4e8;
    }
    .nvx-render-box {
      border: 1px solid #d5d8db;
      border-radius: 3px;
      padding: 8px;
      background: #f8f9fa;
      text-align: center;
    }
    .nvx-render-box div {
      font-size: 11px;
      font-weight: 700;
      color: #55585c;
      margin-bottom: 6px;
    }
    .nvx-render-box img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      background: #ffffff;
      border: 1px solid #e3e6e8;
      display: block;
    }
    .nvx-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e1e4e8;
      margin-bottom: 14px;
    }
    .nvx-tab {
      height: 32px;
      padding: 0 12px;
      border-radius: 3px;
      border: 1px solid #c7c9cc;
      background: #f2f4f5;
      color: #191919;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .nvx-tab.active {
      background: #0084d6;
      border-color: #0074bd;
      color: #ffffff;
    }
    .nvx-section-title {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 10px 0;
      color: #191919;
    }
    .nvx-equipped-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .nvx-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 3px;
      border: 1px solid #8ec5eb;
      background: #eef6fc;
      font-size: 12px;
      font-weight: 700;
    }
    .nvx-chip button {
      border: none;
      background: #c93b2b;
      color: #ffffff;
      border-radius: 2px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .nvx-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 12px;
    }
    .nvx-item {
      border: 1px solid #d0d3d6;
      border-radius: 3px;
      background: #fafafa;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }
    .nvx-item.equipped {
      border-color: #0084d6;
      background: #f0f8ff;
    }
    .nvx-item img {
      width: 100%;
      height: 110px;
      object-fit: contain;
      background: #ffffff;
      border: 1px solid #e4e6e8;
      border-radius: 2px;
    }
    .nvx-item-name {
      font-size: 13px;
      font-weight: 700;
      color: #191919;
    }
    .nvx-item-cat {
      font-size: 11px;
      color: #66696c;
    }
  </style>
</head>
<body id="rbx-body" class="rbx-body light-theme gotham-font" data-internal-page-name="Avatar">
  <div id="wrap" class="wrap no-gutter-ads logged-in" data-gutter-ads-enabled="false">
    <div id="navigation-container" class="light-theme gotham-font">
      <div id="header" class="navbar-fixed-top rbx-header" role="navigation">
        <div class="container-fluid">
          <div class="rbx-navbar-header">
            <div class="navbar-header">
              <a class="navbar-brand" href="/home">
                <span class="icon-logo"></span>
                <span class="icon-logo-r"></span>
              </a>
            </div>
          </div>
          <ul class="nav rbx-navbar hidden-xs hidden-sm col-md-5 col-lg-4">
            <li class="cursor-pointer"><a class="font-header-2 nav-menu-title text-header" href="/games">Games</a></li>
            <li class="cursor-pointer"><a class="font-header-2 nav-menu-title text-header" href="/catalog">Avatar Shop</a></li>
            <li class="cursor-pointer"><a class="font-header-2 nav-menu-title text-header" href="/develop">Create</a></li>
            <li class="cursor-pointer"><a class="font-header-2 nav-menu-title text-header" href="/robux?ctx-nav">Robux</a></li>
          </ul>
        </div>
      </div>
      <div id="navigation" class="rbx-left-col">
        <ul class="left-col-list">
          <li><a class="dynamic-overflow-container text-nav" href="/home" id="nav-home"><div><span class="icon-nav-home"></span></div><span class="font-header-2 dynamic-ellipsis-item">Home</span></a></li>
          <li><a class="dynamic-overflow-container text-nav" href="/users/profile" id="nav-profile"><div><span class="icon-nav-profile"></span></div><span class="font-header-2 dynamic-ellipsis-item">Profile</span></a></li>
          <li><a class="dynamic-overflow-container text-nav" href="/my/avatar" id="nav-character"><div><span class="icon-nav-charactercustomizer"></span></div><span class="font-header-2 dynamic-ellipsis-item">Avatar</span></a></li>
          <li><a class="dynamic-overflow-container text-nav" href="/inventory" id="nav-inventory"><div><span class="icon-nav-inventory"></span></div><span class="font-header-2 dynamic-ellipsis-item">Inventory</span></a></li>
        </ul>
      </div>
    </div>

    <div class="container-main" id="container-main">
      <div class="content">
        <div id="avatar-container" class="row page-content nvx-avatar-page">
          <div avatar-base></div>

          <div class="nvx-topbar">
            <h1>Avatar</h1>
            <div class="nvx-controls-bar">
              <label for="user-id-input">User ID</label>
              <input id="user-id-input" type="text" value="1" />
              <label for="rig-type-select">Rig Type</label>
              <select id="rig-type-select">
                <option value="R6" selected>R6</option>
                <option value="R15">R15</option>
              </select>
              <button id="reload-renders-btn" class="nvx-btn nvx-btn-light" type="button">Refresh Renders</button>
            </div>
          </div>

          <div class="nvx-layout">
            <div class="nvx-card">
              <div id="avatar-full-player"></div>
              <div class="nvx-stage-hint">Drag horizontally to rotate 3D noob</div>

              <div class="nvx-actions">
                <button id="save-avatar-btn" class="nvx-btn" type="button">Save Avatar</button>
                <button id="reset-avatar-btn" class="nvx-btn nvx-btn-light" type="button">Reset</button>
              </div>

              <div id="avatar-save-status">Ready</div>

              <div class="nvx-renders-row">
                <div class="nvx-render-box">
                  <div>avatar.png</div>
                  <img id="preview-avatar-img" alt="Full avatar render" />
                </div>
                <div class="nvx-render-box">
                  <div>headshot.png</div>
                  <img id="preview-headshot-img" alt="Headshot render" />
                </div>
              </div>
            </div>

            <div class="nvx-card">
              <div class="nvx-tabs" id="category-tabs"></div>

              <h2 class="nvx-section-title">Currently Equipped</h2>
              <div class="nvx-equipped-row" id="equipped-list"></div>

              <h2 class="nvx-section-title">Wardrobe</h2>

            </div>
          </div>
        </div>
      </div>
    </div>

    <footer class="container-footer" id="footer-container"></footer>
  </div>

  <script type="module">
    import * as THREE from "https://esm.sh/three@0.169.0";

    const SUPABASE_URL = "https://hdpxjesfeawnntjzttwj.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_I0BgbGkSpxoerOsrnVNvhw_w_s7YP6u";
    const STORAGE_BUCKET = "novrex-avatars";
    const RENDER_BRIDGE_URL = "http://127.0.0.1:3001/render";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const CATEGORIES = ["All", "Hats", "Shirts", "Pants", "Faces", "Gear"];
    const CATALOG_ITEMS = [
      { id: "hat-1", name: "Classic Cap", category: "Hats", thumbnail_url: "https://novrex.lol/asset/?id=1029025" },
      { id: "shirt-1", name: "Novrex Tee", category: "Shirts", thumbnail_url: "https://novrex.lol/asset/?id=144076760" },
      { id: "pants-1", name: "Classic Jeans", category: "Pants", thumbnail_url: "https://novrex.lol/asset/?id=144076512" },
      { id: "face-1", name: "Classic Smile", category: "Faces", thumbnail_url: "https://novrex.lol/asset/?id=120956154" },
      { id: "gear-1", name: "Classic Sword", category: "Gear", thumbnail_url: "https://novrex.lol/asset/?id=125013769" }
    ];

    let activeCategory = "All";
    let equippedItems = [];

    const stageEl = document.getElementById("avatar-full-player");
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      38,
      (stageEl.clientWidth || 308) / (stageEl.clientHeight || 360),
      0.1,
      100
    );
    camera.position.set(0, 2.35, 6.4);
    camera.lookAt(0, 2.25, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(stageEl.clientWidth || 308, stageEl.clientHeight || 360);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    stageEl.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.15);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
    keyLight.position.set(4, 7, 5);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xdbeafe, 0.5);
    fillLight.position.set(-4, 3, -3);
    scene.add(fillLight);

    const rigGroup = new THREE.Group();
    const accessoryGroup = new THREE.Group();
    rigGroup.add(accessoryGroup);
    scene.add(rigGroup);

    function createNoobRig(rigType) {
      while (rigGroup.children.length > 0) {
        const child = rigGroup.children[0];
        if (child !== accessoryGroup) {
          rigGroup.remove(child);
        } else {
          break;
        }
      }

      const yellowMat = new THREE.MeshStandardMaterial({ color: 0xf5cd30, roughness: 0.65, metalness: 0.05 });
      const blueMat = new THREE.MeshStandardMaterial({ color: 0x0d69ab, roughness: 0.65, metalness: 0.05 });
      const greenMat = new THREE.MeshStandardMaterial({ color: 0x4b974b, roughness: 0.65, metalness: 0.05 });

      const isR15 = rigType === "R15";

      const head = new THREE.Mesh(new THREE.BoxGeometry(1.15, 1.15, 1.15), yellowMat);
      head.position.set(0, isR15 ? 3.85 : 3.75, 0);
      rigGroup.add(head);

      const torso = new THREE.Mesh(new THREE.BoxGeometry(2.0, 2.0, 1.0), blueMat);
      torso.position.set(0, 2.15, 0);
      rigGroup.add(torso);

      const leftArm = new THREE.Mesh(new THREE.BoxGeometry(1.0, 2.0, 1.0), yellowMat);
      leftArm.position.set(-1.55, 2.15, 0);
      rigGroup.add(leftArm);

      const rightArm = new THREE.Mesh(new THREE.BoxGeometry(1.0, 2.0, 1.0), yellowMat);
      rightArm.position.set(1.55, 2.15, 0);
      rigGroup.add(rightArm);

      const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.96, 2.0, 1.0), greenMat);
      leftLeg.position.set(-0.52, 0.15, 0);
      rigGroup.add(leftLeg);

      const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.96, 2.0, 1.0), greenMat);
      rightLeg.position.set(0.52, 0.15, 0);
      rigGroup.add(rightLeg);

      if (isR15) {
        torso.scale.set(0.96, 0.96, 0.96);
        leftArm.scale.set(0.92, 0.95, 0.92);
        rightArm.scale.set(0.92, 0.95, 0.92);
        leftLeg.scale.set(0.92, 0.95, 0.92);
        rightLeg.scale.set(0.92, 0.95, 0.92);
      }
    }

    function sync3DAccessories() {
      while (accessoryGroup.children.length > 0) {
        accessoryGroup.remove(accessoryGroup.children[0]);
      }

      equippedItems.forEach((item) => {
        if (item.category === "Hats") {
          const capMat = new THREE.MeshStandardMaterial({ color: 0xd93829, roughness: 0.6 });
          const dome = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.45, 1.25), capMat);
          dome.position.set(0, 4.5, 0);
          const brim = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.14, 1.65), capMat);
          brim.position.set(0, 4.32, 0.25);
          accessoryGroup.add(dome, brim);
        } else if (item.category === "Gear") {
          const bladeMat = new THREE.MeshStandardMaterial({ color: 0xd0d7de, roughness: 0.3, metalness: 0.7 });
          const hiltMat = new THREE.MeshStandardMaterial({ color: 0x3b3f45, roughness: 0.7 });
          const blade = new THREE.Mesh(new THREE.BoxGeometry(0.14, 2.4, 0.36), bladeMat);
          blade.position.set(1.55, 2.8, 1.1);
          blade.rotation.x = Math.PI / 3;
          const guard = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.18, 0.75), hiltMat);
          guard.position.set(1.55, 2.15, 0.45);
          accessoryGroup.add(blade, guard);
        }
      });
    }

    let dragging = false;
    let prevX = 0;

    stageEl.addEventListener("pointerdown", (e) => {
      dragging = true;
      prevX = e.clientX;
      stageEl.setPointerCapture(e.pointerId);
    });

    stageEl.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - prevX;
      prevX = e.clientX;
      rigGroup.rotation.y += dx * 0.012;
    });

    stageEl.addEventListener("pointerup", (e) => {
      dragging = false;
      if (stageEl.hasPointerCapture(e.pointerId)) {
        stageEl.releasePointerCapture(e.pointerId);
      }
    });

    window.addEventListener("resize", () => {
      const w = stageEl.clientWidth || 308;
      const h = stageEl.clientHeight || 360;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    function getUserId() {
      const el = document.getElementById("user-id-input");
      return (el && el.value.trim()) || "1";
    }

    function getRigType() {
      const el = document.getElementById("rig-type-select");
      return (el && el.value) || "R6";
    }

    function renderCategoryTabs() {
      const tabsEl = document.getElementById("category-tabs");
      tabsEl.innerHTML = "";
      CATEGORIES.forEach((cat) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = cat;
        btn.className = "nvx-tab" + (activeCategory === cat ? " active" : "");
        btn.addEventListener("click", () => {
          activeCategory = cat;
          renderCategoryTabs();
          renderInventory();
        });
        tabsEl.appendChild(btn);
      });
    }

    function renderEquippedList() {
      const listEl = document.getElementById("equipped-list");
      listEl.innerHTML = "";
      if (equippedItems.length === 0) {
        const msg = document.createElement("span");
        msg.textContent = "None equipped";
        msg.style.fontSize = "12px";
        msg.style.color = "#66696c";
        listEl.appendChild(msg);
        return;
      }

      equippedItems.forEach((item) => {
        const chip = document.createElement("div");
        chip.className = "nvx-chip";

        const span = document.createElement("span");
        span.textContent = `${item.name} (${item.category})`;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "X";
        btn.addEventListener("click", () => {
          equippedItems = equippedItems.filter((x) => x.id !== item.id);
          sync3DAccessories();
          renderEquippedList();
          renderInventory();
        });

        chip.appendChild(span);
        chip.appendChild(btn);
        listEl.appendChild(chip);
      });
    }

    function toggleEquipItem(item) {
      const exists = equippedItems.some((x) => x.id === item.id);
      if (exists) {
        equippedItems = equippedItems.filter((x) => x.id !== item.id);
      } else {
        equippedItems = equippedItems.filter((x) => x.category !== item.category);
        equippedItems.push(item);
      }
      sync3DAccessories();
      renderEquippedList();
      renderInventory();
    }

    function renderInventory() {
      const gridEl = document.getElementById("inventory-grid");
      gridEl.innerHTML = "";

      const items =
        activeCategory === "All"
          ? CATALOG_ITEMS
          : CATALOG_ITEMS.filter((item) => item.category === activeCategory);

      items.forEach((item) => {
        const isEquipped = equippedItems.some((x) => x.id === item.id);
        const card = document.createElement("div");
        card.className = "nvx-item" + (isEquipped ? " equipped" : "");

        const img = document.createElement("img");
        img.src = item.thumbnail_url;
        img.alt = item.name;
        img.onerror = () => {
          img.removeAttribute("src");
        };

        const name = document.createElement("div");
        name.className = "nvx-item-name";
        name.textContent = item.name;

        const cat = document.createElement("div");
        cat.className = "nvx-item-cat";
        cat.textContent = item.category;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "nvx-btn";
        btn.textContent = isEquipped ? "Unequip" : "Wear";
        btn.addEventListener("click", () => toggleEquipItem(item));

        card.appendChild(img);
        card.appendChild(name);
        card.appendChild(cat);
        card.appendChild(btn);
        gridEl.appendChild(card);
      });
    }

    function refreshStoragePreviews() {
      const userId = getUserId();
      const stamp = Date.now();
      document.getElementById("preview-avatar-img").src =
        `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${encodeURIComponent(userId)}/avatar.png?t=${stamp}`;
      document.getElementById("preview-headshot-img").src =
        `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${encodeURIComponent(userId)}/headshot.png?t=${stamp}`;
    }

    async function buildAndUploadAvatarRenders(userId, items, rigType) {
      const statusEl = document.getElementById("avatar-save-status");
      if (statusEl) statusEl.textContent = "Rendering 3D via RCCService...";

      try {
        const res = await fetch(RENDER_BRIDGE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            userId,
            rigType,
            equippedItems: items
          })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          refreshStoragePreviews();
          if (statusEl) statusEl.textContent = "Saved";
        } else {
          if (statusEl) statusEl.textContent = data.error || "Save failed";
        }
      } catch (_) {
        if (statusEl) statusEl.textContent = "Save failed";
      }
    }

    document.getElementById("rig-type-select").addEventListener("change", () => {
      createNoobRig(getRigType());
      sync3DAccessories();
    });

    document.getElementById("save-avatar-btn").addEventListener("click", () => {
      buildAndUploadAvatarRenders(getUserId(), equippedItems, getRigType());
    });

    document.getElementById("reset-avatar-btn").addEventListener("click", () => {
      equippedItems = [];
      sync3DAccessories();
      renderEquippedList();
      renderInventory();
      buildAndUploadAvatarRenders(getUserId(), equippedItems, getRigType());
    });

    document.getElementById("reload-renders-btn").addEventListener("click", () => {
      refreshStoragePreviews();
    });

    document.getElementById("user-id-input").addEventListener("change", () => {
      refreshStoragePreviews();
    });

    createNoobRig(getRigType());
    sync3DAccessories();
    renderCategoryTabs();
    renderEquippedList();
    renderInventory();
    refreshStoragePreviews();
    animate();
  </script>
</body>
</html>
