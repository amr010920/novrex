<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novrex Avatar Editor</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #e3e5e8;
      color: #191919;
    }
    #avatar-container {
      max-width: 1040px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #c7c9cc;
      border-radius: 4px;
      padding: 20px;
    }
    .editor-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid #d9dadb;
      padding-bottom: 14px;
      margin-bottom: 18px;
    }
    .editor-title {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }
    .user-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .user-controls label {
      font-size: 13px;
      font-weight: 700;
    }
    .user-controls input,
    .user-controls select {
      padding: 6px 10px;
      border: 1px solid #b8babc;
      border-radius: 3px;
      font-size: 13px;
      background: #ffffff;
    }
    .editor-grid {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 780px) {
      .editor-grid {
        grid-template-columns: 1fr;
      }
    }
    .stage-panel {
      background: #f2f4f5;
      border: 1px solid #d0d3d6;
      border-radius: 4px;
      padding: 16px;
      text-align: center;
    }
    #avatar-full-player {
      position: relative;
      width: 240px;
      height: 320px;
      margin: 0 auto 14px auto;
      background: #ffffff;
      border: 1px solid #dfe2e5;
      border-radius: 4px;
    }
    #avatar-full-player .noob-part {
      position: absolute;
      border-radius: 3px;
      border: 1px solid rgba(0, 0, 0, 0.14);
    }
    #avatar-full-player .noob-part[data-part="Head"] {
      width: 56px;
      height: 56px;
      top: 12px;
      left: 92px;
      background: #F5CD30;
    }
    #avatar-full-player .noob-part[data-part="Torso"] {
      width: 84px;
      height: 84px;
      top: 74px;
      left: 78px;
      background: #0D69AB;
    }
    #avatar-full-player .noob-part[data-part="LeftArm"] {
      width: 40px;
      height: 84px;
      top: 74px;
      left: 32px;
      background: #F5CD30;
    }
    #avatar-full-player .noob-part[data-part="RightArm"] {
      width: 40px;
      height: 84px;
      top: 74px;
      left: 168px;
      background: #F5CD30;
    }
    #avatar-full-player .noob-part[data-part="LeftLeg"] {
      width: 40px;
      height: 84px;
      top: 164px;
      left: 78px;
      background: #4B974B;
    }
    #avatar-full-player .noob-part[data-part="RightLeg"] {
      width: 40px;
      height: 84px;
      top: 164px;
      left: 122px;
      background: #4B974B;
    }
    #avatar-equipped-layers {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .avatar-full-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .stage-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 10px;
    }
    button {
      cursor: pointer;
      border: 1px solid #0074bd;
      background: #0084d6;
      color: #ffffff;
      font-weight: 700;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 3px;
    }
    button:hover {
      background: #006fb3;
    }
    button.secondary {
      background: #ffffff;
      color: #191919;
      border-color: #b8babc;
    }
    button.secondary:hover {
      background: #f0f1f2;
    }
    #avatar-save-status {
      font-size: 13px;
      font-weight: 700;
      color: #393b3d;
      min-height: 18px;
    }
    .render-previews {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #d9dadb;
    }
    .preview-box {
      background: #ffffff;
      border: 1px solid #d5d8db;
      border-radius: 3px;
      padding: 8px;
    }
    .preview-box span {
      display: block;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #555;
    }
    .preview-box img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      background: #f7f8f9;
      display: block;
    }
    .catalog-panel {
      min-width: 0;
    }
    .category-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .category-tab {
      background: #f2f4f5;
      color: #191919;
      border-color: #c7c9cc;
    }
    .category-tab.active {
      background: #0084d6;
      color: #ffffff;
      border-color: #0074bd;
    }
    .section-heading {
      font-size: 15px;
      font-weight: 700;
      margin: 14px 0 10px 0;
    }
    .equipped-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .equipped-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #eef6fc;
      border: 1px solid #8ec5eb;
      border-radius: 3px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
    }
    .equipped-chip button {
      padding: 2px 6px;
      font-size: 11px;
      background: #c93b2b;
      border-color: #a82e20;
    }
    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 12px;
    }
    .item-card {
      border: 1px solid #d0d3d6;
      border-radius: 4px;
      padding: 10px;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }
    .item-card.equipped {
      border-color: #0084d6;
      background: #f0f8ff;
    }
    .item-card img {
      width: 100%;
      height: 110px;
      object-fit: contain;
      background: #ffffff;
      border: 1px solid #e4e6e8;
      border-radius: 3px;
    }
    .item-name {
      font-size: 13px;
      font-weight: 700;
    }
    .item-category {
      font-size: 11px;
      color: #666;
    }
  </style>
</head>
<body>
  <div id="avatar-editor-app">
    <div id="avatar-container">
      <div class="editor-header">
        <h1 class="editor-title">Avatar Editor</h1>
        <div class="user-controls">
          <label for="user-id-input">User ID</label>
          <input id="user-id-input" type="text" value="1" />
          <label for="rig-type-select">Rig</label>
          <select id="rig-type-select">
            <option value="R6" selected>R6</option>
            <option value="R15">R15</option>
          </select>
          <button id="reload-renders-btn" class="secondary" type="button">Refresh Renders</button>
        </div>
      </div>

      <div class="editor-grid">
        <div class="stage-panel">
          <div id="avatar-full-player">
            <div class="noob-part" data-part="Head"></div>
            <div class="noob-part" data-part="Torso"></div>
            <div class="noob-part" data-part="LeftArm"></div>
            <div class="noob-part" data-part="RightArm"></div>
            <div class="noob-part" data-part="LeftLeg"></div>
            <div class="noob-part" data-part="RightLeg"></div>
            <div id="avatar-equipped-layers"></div>
          </div>

          <div class="stage-actions">
            <button id="save-avatar-btn" type="button">Save Avatar</button>
            <button id="reset-avatar-btn" class="secondary" type="button">Reset Noob</button>
          </div>

          <div id="avatar-save-status">Ready</div>

          <div class="render-previews">
            <div class="preview-box">
              <span>avatar.png</span>
              <img id="preview-avatar-img" alt="Full avatar render" />
            </div>
            <div class="preview-box">
              <span>headshot.png</span>
              <img id="preview-headshot-img" alt="Headshot render" />
            </div>
          </div>
        </div>

        <div class="catalog-panel">
          <div class="category-tabs" id="category-tabs"></div>

          <div class="section-heading">Equipped Items</div>
          <div class="equipped-list" id="equipped-list"></div>

          <div class="section-heading">Inventory</div>
          <div class="inventory-grid" id="inventory-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://hdpxjesfeawnntjzttwj.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_I0BgbGkSpxoerOsrnVNvhw_w_s7YP6u";
    const STORAGE_BUCKET = "novrex-avatars";
    const RENDER_BRIDGE_URL = "http://127.0.0.1:3001/render";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const CATEGORIES = ["All", "Hats", "Shirts", "Pants", "Faces", "Gear"];

    const CATALOG_ITEMS = [
      {
        id: "hat-1",
        name: "Classic Cap",
        category: "Hats",
        thumbnail_url: "https://novrex.lol/asset/?id=1029025",
        overlay_url: ""
      },
      {
        id: "shirt-1",
        name: "Novrex Tee",
        category: "Shirts",
        thumbnail_url: "https://novrex.lol/asset/?id=144076760",
        overlay_url: ""
      },
      {
        id: "pants-1",
        name: "Classic Jeans",
        category: "Pants",
        thumbnail_url: "https://novrex.lol/asset/?id=144076512",
        overlay_url: ""
      },
      {
        id: "face-1",
        name: "Classic Smile",
        category: "Faces",
        thumbnail_url: "https://novrex.lol/asset/?id=120956154",
        overlay_url: ""
      },
      {
        id: "gear-1",
        name: "Classic Sword",
        category: "Gear",
        thumbnail_url: "https://novrex.lol/asset/?id=125013769",
        overlay_url: ""
      }
    ];

    let activeCategory = "All";
    let equippedItems = [];

    function getUserId() {
      const el = document.getElementById("user-id-input");
      return (el && el.value.trim()) || "1";
    }

    function getRigType() {
      const el = document.getElementById("rig-type-select");
      return (el && el.value) || "R6";
    }

    function renderCategoryTabs() {
      const tabsEl = document.getElementById("category-tabs");
      tabsEl.innerHTML = "";
      CATEGORIES.forEach((cat) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = cat;
        btn.className = "category-tab" + (activeCategory === cat ? " active" : "");
        btn.addEventListener("click", () => {
          activeCategory = cat;
          renderCategoryTabs();
          renderInventory();
        });
        tabsEl.appendChild(btn);
      });
    }

    function renderEquippedLayers() {
      const layersEl = document.getElementById("avatar-equipped-layers");
      layersEl.innerHTML = "";
      equippedItems.forEach((item) => {
        if (!item.overlay_url) return;
        const img = document.createElement("img");
        img.src = item.overlay_url;
        img.alt = item.name;
        img.className = "avatar-full-layer";
        layersEl.appendChild(img);
      });
    }

    function renderEquippedList() {
      const listEl = document.getElementById("equipped-list");
      listEl.innerHTML = "";
      if (equippedItems.length === 0) {
        const empty = document.createElement("span");
        empty.textContent = "No items equipped";
        empty.style.fontSize = "12px";
        empty.style.color = "#666";
        listEl.appendChild(empty);
        return;
      }

      equippedItems.forEach((item) => {
        const chip = document.createElement("div");
        chip.className = "equipped-chip";

        const label = document.createElement("span");
        label.textContent = `${item.name} (${item.category})`;

        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.textContent = "X";
        removeBtn.addEventListener("click", () => {
          equippedItems = equippedItems.filter((x) => x.id !== item.id);
          renderEquippedLayers();
          renderEquippedList();
          renderInventory();
        });

        chip.appendChild(label);
        chip.appendChild(removeBtn);
        listEl.appendChild(chip);
      });
    }

    function toggleEquipItem(item) {
      const exists = equippedItems.some((x) => x.id === item.id);
      if (exists) {
        equippedItems = equippedItems.filter((x) => x.id !== item.id);
      } else {
        equippedItems = equippedItems.filter((x) => x.category !== item.category);
        equippedItems.push(item);
      }
      renderEquippedLayers();
      renderEquippedList();
      renderInventory();
    }

    function renderInventory() {
      const gridEl = document.getElementById("inventory-grid");
      gridEl.innerHTML = "";

      const filtered =
        activeCategory === "All"
          ? CATALOG_ITEMS
          : CATALOG_ITEMS.filter((item) => item.category === activeCategory);

      filtered.forEach((item) => {
        const isEquipped = equippedItems.some((x) => x.id === item.id);
        const card = document.createElement("div");
        card.className = "item-card" + (isEquipped ? " equipped" : "");

        const img = document.createElement("img");
        img.src = item.thumbnail_url;
        img.alt = item.name;
        img.onerror = () => {
          img.removeAttribute("src");
        };

        const nameEl = document.createElement("div");
        nameEl.className = "item-name";
        nameEl.textContent = item.name;

        const catEl = document.createElement("div");
        catEl.className = "item-category";
        catEl.textContent = item.category;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = isEquipped ? "Unequip" : "Equip";
        btn.addEventListener("click", () => toggleEquipItem(item));

        card.appendChild(img);
        card.appendChild(nameEl);
        card.appendChild(catEl);
        card.appendChild(btn);
        gridEl.appendChild(card);
      });
    }

    function refreshStoragePreviews() {
      const userId = getUserId();
      const cacheBust = Date.now();
      const fullUrl = `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${encodeURIComponent(userId)}/avatar.png?t=${cacheBust}`;
      const headUrl = `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${encodeURIComponent(userId)}/headshot.png?t=${cacheBust}`;

      document.getElementById("preview-avatar-img").src = fullUrl;
      document.getElementById("preview-headshot-img").src = headUrl;
    }

    async function buildAndUploadAvatarRenders(userId, items, rigType) {
      const statusEl = document.getElementById("avatar-save-status");
      if (statusEl) statusEl.textContent = "Rendering...";

      try {
        const res = await fetch(RENDER_BRIDGE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            userId,
            rigType,
            equippedItems: items
          })
        });

        const data = await res.json();
        if (res.ok && data.ok) {
          refreshStoragePreviews();
          if (statusEl) statusEl.textContent = "Saved";
        } else {
          if (statusEl) statusEl.textContent = data.error || "Save failed";
        }
      } catch (_) {
        if (statusEl) statusEl.textContent = "Save failed";
      }
    }

    document.getElementById("save-avatar-btn").addEventListener("click", () => {
      buildAndUploadAvatarRenders(getUserId(), equippedItems, getRigType());
    });

    document.getElementById("reset-avatar-btn").addEventListener("click", () => {
      equippedItems = [];
      renderEquippedLayers();
      renderEquippedList();
      renderInventory();
      buildAndUploadAvatarRenders(getUserId(), equippedItems, getRigType());
    });

    document.getElementById("reload-renders-btn").addEventListener("click", () => {
      refreshStoragePreviews();
    });

    document.getElementById("user-id-input").addEventListener("change", () => {
      refreshStoragePreviews();
    });

    renderCategoryTabs();
    renderEquippedLayers();
    renderEquippedList();
    renderInventory();
    refreshStoragePreviews();
  </script>
</body>
</html>
