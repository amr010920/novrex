<script>
const SUPABASE_URL = "https://hdpxjesfeawnntjzttwj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_I0BgbGkSpxoerOsrnVNvhw_w_s7YP6u";
const STORAGE_BUCKET = "novrex-avatars";
const MAX_WIDTH = 1280;
const MAX_HEIGHT = 720;
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function fit720p(srcWidth, srcHeight) {
  const ratio = Math.min(MAX_WIDTH / srcWidth, MAX_HEIGHT / srcHeight, 1);
  return {
    width: Math.max(1, Math.round(srcWidth * ratio)),
    height: Math.max(1, Math.round(srcHeight * ratio))
  };
}

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}

async function buildAndUploadAvatarRenders(userId, equippedItems) {
  const fullCanvas = document.getElementById("avatar-full-canvas");
  const headCanvas = document.getElementById("avatar-headshot-canvas");
  const fullCtx = fullCanvas.getContext("2d");
  const headCtx = headCanvas.getContext("2d");

  fullCanvas.width = 720;
  fullCanvas.height = 720;
  headCanvas.width = 720;
  headCanvas.height = 720;

  fullCtx.clearRect(0, 0, fullCanvas.width, fullCanvas.height);
  headCtx.clearRect(0, 0, headCanvas.width, headCanvas.height);

  for (const item of equippedItems) {
    if (!item.thumbnail_url) continue;
    try {
      const img = await loadImage(item.thumbnail_url);
      const fullDim = fit720p(img.naturalWidth || 720, img.naturalHeight || 720);
      const fx = Math.round((fullCanvas.width - fullDim.width) / 2);
      const fy = Math.round((fullCanvas.height - fullDim.height) / 2);
      fullCtx.drawImage(img, fx, fy, fullDim.width, fullDim.height);

      if (["Hat", "Hair", "Face", "Head"].includes(item.asset_type)) {
        const cropSize = Math.min(img.naturalWidth || 720, img.naturalHeight || 720);
        const headDim = fit720p(cropSize, cropSize);
        const hx = Math.round((headCanvas.width - headDim.width) / 2);
        const hy = Math.round((headCanvas.height - headDim.height) / 2);
        headCtx.drawImage(img, 0, 0, cropSize, cropSize, hx, hy, headDim.width, headDim.height);
      }
    } catch (_) {}
  }

  const fullBlob = await new Promise((resolve) => fullCanvas.toBlob(resolve, "image/png"));
  const headBlob = await new Promise((resolve) => headCanvas.toBlob(resolve, "image/png"));
  const statusEl = document.getElementById("avatar-save-status");

  if (!fullBlob || !headBlob) return;

  const fullPath = `${userId}/avatar.png`;
  const headPath = `${userId}/headshot.png`;

  const [fullRes, headRes] = await Promise.all([
    sb.storage.from(STORAGE_BUCKET).upload(fullPath, fullBlob, { contentType: "image/png", upsert: true }),
    sb.storage.from(STORAGE_BUCKET).upload(headPath, headBlob, { contentType: "image/png", upsert: true })
  ]);

  if (fullRes.error || headRes.error) {
    if (statusEl) statusEl.textContent = "Upload failed";
    return;
  }

  const fullUrl = sb.storage.from(STORAGE_BUCKET).getPublicUrl(fullPath).data.publicUrl;
  const headUrl = sb.storage.from(STORAGE_BUCKET).getPublicUrl(headPath).data.publicUrl;

  const fullImg = document.getElementById("avatar-full-preview");
  const headImg = document.getElementById("avatar-headshot-preview");
  if (fullImg) fullImg.src = `${fullUrl}?t=${Date.now()}`;
  if (headImg) headImg.src = `${headUrl}?t=${Date.now()}`;
  if (statusEl) statusEl.textContent = "Saved (max 720p)";
}

let currentEquipped = [];
let currentUserId = null;

async function loadOwnedInventory() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;
  currentUserId = user.id;

  const { data: ownedItems, error } = await sb
    .from("v_user_inventory")
    .select("*")
    .eq("user_id", user.id)
    .order("acquired_at", { ascending: false });

  if (error) {
    console.error(error);
    return;
  }

  currentEquipped = (ownedItems || []).filter((i) => i.is_equipped);
  renderInventory(ownedItems || []);
}

async function toggleEquip(ownershipId, currentState) {
  const { error } = await sb
    .from("user_owned_items")
    .update({ is_equipped: !currentState })
    .eq("id", ownershipId);

  if (!error) {
    await loadOwnedInventory();
    if (currentUserId) {
      await buildAndUploadAvatarRenders(currentUserId, currentEquipped);
    }
  }
}

function renderInventory(items) {
  const equippedEl = document.getElementById("avatar-equipped-list");
  const gridEl = document.getElementById("avatar-owned-grid");
  equippedEl.innerHTML = "";
  gridEl.innerHTML = "";

  const equipped = items.filter((i) => i.is_equipped);
  equipped.forEach((item) => {
    const chip = document.createElement("span");
    chip.className = "equipped-item";
    chip.textContent = item.name;
    equippedEl.appendChild(chip);
  });

  items.forEach((item) => {
    const card = document.createElement("div");
    card.className = item.is_equipped ? "item-card equipped" : "item-card";

    const img = document.createElement("img");
    img.src = item.thumbnail_url || "";
    img.alt = item.name;

    const title = document.createElement("div");
    title.textContent = item.name;

    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = item.is_equipped ? "Remove" : "Wear";
    btn.onclick = () => toggleEquip(item.ownership_id, item.is_equipped);

    card.appendChild(img);
    card.appendChild(title);
    card.appendChild(btn);
    gridEl.appendChild(card);
  });
}

document.getElementById("save-avatar-renders-btn").addEventListener("click", () => {
  if (currentUserId) {
    buildAndUploadAvatarRenders(currentUserId, currentEquipped);
  }
});

loadOwnedInventory();
</script>
